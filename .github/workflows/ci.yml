name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found" >&2
            exit 1
          fi
          printf 'shellchecking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  linux-release-test:
    name: linux-release dispatch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run build-dispatch.sh
        run: bash linux-release/tests/build-dispatch.sh

  setup-nix-arm:
    name: setup-nix on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: paolino is configured as a read substituter
        run: nix config show substituters | tr ' ' '\n' | grep -qx 'https://paolino.cachix.org'

  dep-graph-test:
    name: dep-graph render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: graph
        uses: ./dep-graph
        with:
          language: haskell
          owner-regex: "numtide|NixOS"
          output: /tmp/dev-assets-deps.md
          title: "dev-assets dependency graph"
          staleness: "false"
      - name: Assert output shape
        run: >-
          bash dep-graph/tests/assert-output.sh
          "${{ steps.graph.outputs.path }}"
          "dev-assets dependency graph"

  lib-self-test:
    name: lib self-test (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the artifact matrix
        run: nix build -L .#self-test
      - name: Smoke every artifact from its extracted form
        run: nix run .#self-test-smoke
