name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found" >&2
            exit 1
          fi
          printf 'shellchecking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  linux-release-test:
    name: linux-release dispatch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run build-dispatch.sh
        run: bash linux-release/tests/build-dispatch.sh

  setup-nix-arm:
    name: setup-nix on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: paolino is configured as a read substituter
        run: nix config show substituters | tr ' ' '\n' | grep -qx 'https://paolino.cachix.org'
